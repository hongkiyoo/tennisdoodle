<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>TennisDoodle</title>
  <meta name="theme-color" content="#3d6b4e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TennisDoodle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <main id="app">
    <svg id="board" aria-label="테니스 코트. 선수와 공을 끌어서 옮길 수 있습니다">
      <g id="court"></g>
      <g id="strokes"></g>
      <g id="live"></g>
      <g id="pieces"></g>
    </svg>
    <div id="safe-top" aria-hidden="true"></div>

    <nav class="toolbar" aria-label="도구">
      <!-- normal mode -->
      <div id="bar-main" class="bar">
        <button id="btn-scenes" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 12h14M12 7v10"/></svg>
          <span>장면</span>
        </button>
        <button id="btn-draw" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c4-1 6-5 9-9s5-5 7-5"/><path d="m16 4 4 2-2 4"/></svg>
          <span>그리기</span>
        </button>
        <button id="btn-share" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>
          <span>공유</span>
        </button>
        <button id="btn-undo" class="tool undo" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>되돌리기</span>
        </button>
      </div>
      <!-- drawing mode -->
      <div id="bar-draw" class="bar" hidden>
        <div class="seg" role="group" aria-label="선 종류">
          <button id="kind-move" type="button" aria-pressed="true"><i class="swatch move"></i>이동</button>
          <button id="kind-shot" type="button" aria-pressed="false"><i class="swatch shot"></i>공</button>
        </div>
        <button id="btn-clear" class="tool" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span>모두 지우기</span>
        </button>
        <button id="btn-undo2" class="tool undo" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>되돌리기</span>
        </button>
        <button id="btn-draw-done" class="done" type="button">완료</button>
      </div>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- scene sheet: mode, formations, saved scenes -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-backdrop" data-close></div>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-head">
          <h2 id="sheet-title">장면</h2>
          <button class="text-btn" type="button" data-close>닫기</button>
        </header>
        <div class="sheet-body">
          <div class="row">
            <h3>경기 방식</h3>
            <div class="seg light" role="group" aria-label="경기 방식">
              <button id="mode-singles" type="button">단식</button>
              <button id="mode-doubles" type="button">복식</button>
            </div>
          </div>

          <h3 id="preset-title">포메이션</h3>
          <div id="preset-list" class="preset-list"></div>

          <div class="row">
            <h3>저장한 장면</h3>
            <button id="btn-save-open" class="text-btn" type="button">현재 장면 저장</button>
          </div>
          <form id="save-form" class="save-form" hidden>
            <label for="save-name" class="sr">장면 이름</label>
            <input id="save-name" type="text" maxlength="30" autocomplete="off" enterkeyhint="done">
            <button type="submit" class="primary">저장</button>
          </form>
          <ul id="saved-list" class="saved-list"></ul>
          <p id="saved-empty" class="empty">아직 저장한 장면이 없습니다. 작전을 짠 뒤 ‘현재 장면 저장’을 누르세요.</p>
        </div>
      </section>
    </div>

    <!-- player name editor -->
    <div id="name-dialog" class="sheet center" hidden>
      <div class="sheet-backdrop" data-close></div>
      <form id="name-form" class="name-card" role="dialog" aria-modal="true" aria-labelledby="name-title">
        <h2 id="name-title">선수 이름</h2>
        <p class="hint">코트에 표시될 짧은 이름 (최대 4글자)</p>
        <label for="name-input" class="sr">이름</label>
        <input id="name-input" type="text" maxlength="4" autocomplete="off" enterkeyhint="done">
        <div class="name-actions">
          <button type="button" id="name-reset" class="text-btn">기본값</button>
          <button type="button" class="text-btn" data-close>취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
